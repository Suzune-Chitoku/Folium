name: Build Folium IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download AntiqueKit
        run: |
          cd ..
          git clone https://github.com/jarrodnorwell/AntiqueKit.git || git clone https://github.com/folium-app-backup/AntiqueKit.git

      - name: Install Boost headers
        run: |
          brew install boost
          sudo mkdir -p /usr/local/include
          sudo ln -sfn "$(brew --prefix boost)/include/boost" /usr/local/include/boost

      - name: Build Folium
        run: |
          xcodebuild clean build \
            -quiet \
            -project Folium.xcodeproj \
            -scheme Folium \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/Folium.app Payload/
          zip -r Folium.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Folium-IPA
          path: Folium.ipa
